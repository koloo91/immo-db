# Nixpacks configuration for Railway
[phases.setup]
nixPkgs = ["...", "python3", "gcc", "gnumake", "pkg-config", "gcc-unwrapped"]
aptPkgs = ["...", "libatomic1"]
nixLibs = ["...", "gcc-unwrapped"]
cmds = ["npm install -g node-gyp"]

[phases.install]
cmds = ["bun install"]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "node .output/server/index.mjs"
